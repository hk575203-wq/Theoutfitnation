      border: 2px solid var(--gold-primary);

      align-items: center;
      justify-content: center;
      background: #000;

    .brand-emblem svg {
      width: 40px;
      height: 40px;
    }

      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1f1f23;
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 8px;
      color: #e5e5ea;
    }

    .stars {
      color: #f59e0b;
      font-size: 12px;

      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);

      background: var(--gold-primary);

      display: flex;
      align-items: center;

    .pill {

      border: 1px solid var(--border-color);
      color: #9ca3af;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--gold-gradient);
      color: #000;
      border-color: transparent;
      font-weight: 700;

    .lang-row {

      align-items: center;
      margin-top: 4px;

    .unique-badge {

    const reviewRedirectUrl = "https://search.google.com/local/writereview?placeid=ChIJMb6FeQBpfDkR17jIyDxRrWU";
    
    // Anti-repeat session memory
    let recentReviews = [];

    // Hardware Cryptographic Random Generator
    function getCryptoRandomItem(arr) {
      if (!arr || arr.length === 0) return "";
      const randomBuffer = new Uint32Array(1);
      window.crypto.getRandomValues(randomBuffer);
      const randomIndex = randomBuffer[0] % arr.length;
      return arr[randomIndex];
    }

    function generateUniqueReview() {
      const catData = (combinatorialData[activeLang] && combinatorialData[activeLang][activeCategory]) 
                      ? combinatorialData[activeLang][activeCategory] 
                      : combinatorialData[activeLang]['all'];

      let newReview = "";
      let attempts = 0;

      // Loop to ensure non-repeating sequence
      do {
        const p1 = getCryptoRandomItem(catData.openers);
        const p2 = getCryptoRandomItem(catData.details);
        const p3 = getCryptoRandomItem(catData.experience);
        const p4 = getCryptoRandomItem(catData.closers);
        newReview = `${p1} ${p2} ${p3} ${p4}`;
        attempts++;
      } while (recentReviews.includes(newReview) && attempts < 12);

      recentReviews.push(newReview);
      if (recentReviews.length > 6) recentReviews.shift();

      return newReview;
    }

    function updateReviewText() {
      document.getElementById('review-content').innerText = generateUniqueReview();
    }

    function setCategory(el, cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      updateReviewText();
    }

    function setLang(lang) {
      activeLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
      updateReviewText();
    }

    function shuffleReview() {
      updateReviewText();
    }

    function copyAndRedirect() {
      const textToCopy = document.getElementById('review-content').innerText.trim();
      const btn = document.getElementById('copy-btn');

      btn.classList.add('copied');
      btn.innerHTML = "<span>✓</span> OPENING GOOGLE...";

      const doRedirect = () => {
        window.location.href = reviewRedirectUrl;
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          setTimeout(doRedirect, 250);
        }).catch(doRedirect);
      } else {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = textToCopy;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        setTimeout(doRedirect, 250);
      }
    }

    // Initial trigger
    updateReviewText();
