<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Outfit Nation | Official 5-Star Experience</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --card-bg: #161619;
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #996515 100%);
      --text-main: #fcfcfd;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.1);
      --chip-bg: #222226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 410px;
      border-radius: 24px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Brand Header */
    .header {
      padding: 20px 16px 12px;
      text-align: center;
    }

    .brand-emblem {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    .brand-emblem svg {
      width: 40px;
      height: 40px;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 3px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.2px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #1f1f23;
      border: 1px solid var(--border-color);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 8px;
      color: #e5e5ea;
    }

    .stars {
      color: #f59e0b;
      font-size: 12px;
      letter-spacing: 1px;
    }

    /* 3-Step Guide */
    .steps-bar {
      display: flex;
      justify-content: space-between;
      margin: 6px 16px 10px;
      background: #111113;
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .step-num {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--gold-primary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9.5px;
      font-weight: 800;
    }

    /* Controls */
    .controls {
      padding: 0 16px 6px;
    }

    .pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      color: #9ca3af;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--gold-gradient);
      color: #000;
      border-color: transparent;
      font-weight: 700;
    }

    .lang-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 6px;
    }

    .unique-badge {
      font-size: 10px;
      color: #d4af37;
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #0d0d0f;
      padding: 2px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 10.5px;
      padding: 3px 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }

    .seg-btn.active {
      background: #27272a;
      color: #fff;
    }

    /* Review Box */
    .review-wrapper {
      padding: 0 16px 14px;
    }

    .review-box {
      position: relative;
      background: #0f0f11;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px 44px 12px 14px;
      min-height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .review-text {
      font-size: 13px;
      line-height: 1.5;
      color: #f3f4f6;
      font-weight: 500;
      outline: none;
    }

    .review-hint {
      margin-top: 5px;
      font-size: 9.5px;
      color: #6b7280;
    }

    .refresh-btn {
      position: absolute;
      right: 10px;
      top: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #222226;
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      cursor: pointer;
    }

    /* CTA Button */
    .cta-btn {
      margin-top: 12px;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--gold-gradient);
      color: #0b0b0d;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
    }

    .cta-btn.copied {
      background: #10b981;
      color: #fff;
    }

    /* Footer Hub */
    .footer-nav {
      background: #111114;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 12px 8px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
    }

    .nav-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #1c1c20;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="brand-emblem">
        <svg viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" fill="none" stroke="#d4af37" stroke-width="4.5"/>
          <path d="M 28 32 C 38 24 62 24 72 32" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
          <rect x="47.5" y="24" width="5" height="54" rx="2" fill="#d4af37"/>
          <path d="M 38 43 L 38 65 M 38 43 L 62 65 M 62 43 L 62 65" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h1 class="brand-title">The Outfit Nation</h1>
      <p class="brand-subtitle">Premium Wear • Casual Comfort • Bhopal</p>

      <div class="verified-pill">
        <span style="color:#4285F4;font-weight:bold;">G</span> Google Verified Rating 
        <span class="stars">★★★★★</span>
      </div>
    </div>

    <div class="steps-bar">
      <div class="step-item"><span class="step-num">1</span> Pick Topic</div>
      <div class="step-item"><span class="step-num">2</span> Tap Button</div>
      <div class="step-item"><span class="step-num">3</span> Paste & Post</div>
    </div>

    <div class="controls">
      <div class="pills">
        <button class="pill active" onclick="setCategory(this, 'all')">✨ ALL</button>
        <button class="pill" onclick="setCategory(this, 'street')">🔥 OVERSIZED & TEES</button>
        <button class="pill" onclick="setCategory(this, 'shirts')">👔 SHIRTS & DENIM</button>
        <button class="pill" onclick="setCategory(this, 'service')">⭐ STORE & STAFF</button>
      </div>

      <div class="lang-row">
        <span class="unique-badge">⚡ Instant Review</span>
        <div class="segmented-control">
          <button class="seg-btn active" id="btn-en" onclick="setLang('en')">EN</button>
          <button class="seg-btn" id="btn-hi" onclick="setLang('hi')">HINGLISH</button>
        </div>
      </div>
    </div>

    <div class="review-wrapper">
      <div class="review-box">
        <div class="review-text" id="review-content" contenteditable="true" spellcheck="false">Loading review...</div>
        <p class="review-hint">✎ Tap text above to personalize if needed</p>
        <button class="refresh-btn" onclick="shuffleReview()" title="Next Review">⟳</button>
      </div>

      <button class="cta-btn" id="copy-btn" onclick="copyAndRedirect()">
        <span>📋</span> COPY & RATE 5-STAR
      </button>
    </div>

    <div class="footer-nav">
      <a href="https://search.google.com/local/writereview?placeid=ChIJMb6FeQBpfDkR17jIyDxRrWU" class="nav-btn" target="_blank">
        <div class="nav-icon">📍</div>
        Store Map
      </a>
      <a href="https://wa.me/917477237731?text=Hi%20The%20Outfit%20Nation,%20I%20visited%20your%20store%20and%20loved%20the%20collection!" class="nav-btn" target="_blank">
        <div class="nav-icon">💬</div>
        WhatsApp
      </a>
      <a href="tel:+917477237731" class="nav-btn">
        <div class="nav-icon">📞</div>
        Call Us
      </a>
      <a href="https://www.instagram.com/theoutfitnation_?vrfl=MTFxM2o1dDM2YTUzag==" class="nav-btn" target="_blank">
        <div class="nav-icon">📸</div>
        Instagram
      </a>
    </div>
  </div>

  <script>

        shirts: {

          ],
          closers: [

          ]
        },
        service: {
          openers: [

            "Shopping here was such a seamless and pleasant experience."
          ],
          details: [

            "Everything is organized cleanly, making shopping fast and easy."
          ],

            "The owners and staff prioritize customer satisfaction above all."
          ],
          closers: [

        }
      },
      hi: {
        all: {
          openers: [
            "Bhopal me trendy aur stylish kapdo ke liye sabse best shop hai!",
            "The Outfit Nation par shopping karke dil khush ho gaya.",
            "Bhopal me streetwear aur casuals ke liye number one choice hai."
          ],
          details: [

            "Kapde ka material bohot heavy aur durable hai, fitting bhi ekdum perfect aayi.",

        },
        street: {
          openers: [
            "Inka oversized t-shirts aur streetwear stock pure Bhopal me best hai!",
            "Streetwear lovers ke liye Bhopal me ye store best heaven hai."
          ],

          experience: [

          ],

        },
        shirts: {

            "Yahan se formal aur party shirts li, fitting ekdum luxury aayi!",
            "Shirts aur stretch denim jeans ki collection bohot classy hai."
          ],

          ],

            "Bhopal me classy outfits ke liye bilkul best store!"
          ]
        },
        service: {
          openers: [
            "Bohot badhiya customer service aur friendly environment mila.",
            "Store par shopping ka experience bohot comfortable aur smooth raha."
          ],
          details: [
            "Staff bohot humble hai aur zabardasti product bechne ka pressure nahi deta.",
            "Store neat and clean hai aur billing counter par fast service milti hai."
          ],
          experience: [
            "Har customer ko personal attention ke sath attend karte hain.",
            "Friendly atmosphere aur cooperative behaviour ne dil jeet liya."
          ],
          closers: [
            "10/10 customer experience! Sabhi dosto ko zaroor recommend karunga.",
            "Keep up the great work. Bhopal needs more stores like this!"
          ]
        }
      }
    };

    let activeCategory = 'all';
    let activeLang = 'en';
    const reviewRedirectUrl = "https://search.google.com/local/writereview?placeid=ChIJMb6FeQBpfDkR17jIyDxRrWU";

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function generateUniqueReview() {
      const catData = combinatorialData[activeLang][activeCategory] || combinatorialData[activeLang]['all'];
      return `${getRandomItem(catData.openers)} ${getRandomItem(catData.details)} ${getRandomItem(catData.experience)} ${getRandomItem(catData.closers)}`;
    }

    function updateReviewText() {
      document.getElementById('review-content').innerText = generateUniqueReview();
    }

    function setCategory(el, cat) {
      activeCategory = cat;
      document.querySelectorAll('.pill').forEach(btn => btn.classList.remove('active'));
      el.classList.add('active');
      updateReviewText();
    }

    function setLang(lang) {
      activeLang = lang;
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('btn-hi').classList.toggle('active', lang === 'hi');
      updateReviewText();
    }

    function shuffleReview() {
      updateReviewText();
    }

    function copyAndRedirect() {
      const textToCopy = document.getElementById('review-content').innerText.trim();
      const btn = document.getElementById('copy-btn');

      btn.classList.add('copied');
      btn.innerHTML = "<span>✓</span> OPENING GOOGLE...";

      const doRedirect = () => {
        window.location.href = reviewRedirectUrl;
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy).then(() => {
          setTimeout(doRedirect, 250);
        }).catch(doRedirect);
      } else {
        const dummy = document.createElement("textarea");
        document.body.appendChild(dummy);
        dummy.value = textToCopy;
        dummy.select();
        document.execCommand("copy");
        document.body.removeChild(dummy);
        setTimeout(doRedirect, 250);
      }
    }

    updateReviewText();
  </script>
</body>
</html>
