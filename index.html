<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>The Outfit Nation | Official 5-Star Experience</title>
  <style>
    :root {
      --bg: #070709;
      --card-bg: rgba(18, 18, 20, 0.88);
      --gold-primary: #d4af37;
      --gold-gradient: linear-gradient(135deg, #fef08a 0%, #d4af37 50%, #996515 100%);
      --gold-glow: rgba(212, 175, 55, 0.28);
      --text-main: #fcfcfd;
      --text-muted: #9ca3af;
      --border-color: rgba(255, 255, 255, 0.09);
      --chip-bg: rgba(255, 255, 255, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.16) 0%, transparent 65%),
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 14px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      width: 100%;
      max-width: 420px;
      border-radius: 28px;
      border: 1px solid rgba(212, 175, 55, 0.28);
      box-shadow: 0 25px 65px rgba(0,0,0,0.85), 0 0 35px var(--gold-glow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Top Brand Header */
    .header {
      padding: 24px 20px 14px;
      text-align: center;
      position: relative;
    }

    .brand-emblem {
      width: 66px;
      height: 66px;
      margin: 0 auto 12px;
      border-radius: 50%;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 22px rgba(212, 175, 55, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #1c1c1f 0%, #000 100%);
    }

    .brand-emblem svg {
      width: 44px;
      height: 44px;
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .verified-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 11px;
      margin-top: 10px;
      color: #e5e5ea;
    }

    .stars {
      color: #f59e0b;
      font-size: 13px;
      letter-spacing: 2px;
    }

    /* 3-Step Guide */
    .steps-bar {
      display: flex;
      justify-content: space-between;
      margin: 8px 18px 12px;
      background: rgba(0, 0, 0, 0.4);
      padding: 9px 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }

    .step-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 10.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .step-num {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--gold-primary);
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
    }

    /* Category Controls */
    .controls {
      padding: 0 18px 8px;
    }

    .pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      scrollbar-width: none;
    }
    .pills::-webkit-scrollbar { display: none; }

    .pill {
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      color: #9ca3af;
      padding: 7px 13px;
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .pill.active {
      background: var(--gold-gradient);
      color: #0b0b0d;
      border-color: transparent;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.35);
      font-weight: 700;
    }

    .lang-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      margin-bottom: 8px;
    }

    .unique-badge {
      font-size: 10px;
      color: #d4af37;
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: 600;
    }

    .segmented-control {
      display: flex;
      background: #111113;
      padding: 3px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .seg-btn {
      background: transparent;
      border: none;
      color: #71717a;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .seg-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }

    /* Review Card & Dynamic Textarea */
    .review-wrapper {
      padding: 0 18px 18px;
    }

    .review-box {
      position: relative;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 18px;
      padding: 16px 48px 14px 16px;
      min-height: 105px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    }

    .review-text {
      font-size: 13.5px;
      line-height: 1.55;
      color: #f3f4f6;
      font-weight: 500;
      transition: opacity 0.2s ease, transform 0.2s ease;
      outline: none;
    }

    .review-hint {
      margin-top: 6px;
      font-size: 10px;
      color: #6b7280;
      font-style: italic;
    }

    .refresh-btn {
      position: absolute;
      right: 12px;
      top: 14px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .refresh-btn:active {
      transform: rotate(180deg) scale(0.92);
      background: rgba(212, 175, 55, 0.25);
    }

    /* CTA Button */
    .cta-btn {
      margin-top: 14px;
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: var(--gold-gradient);
      color: #0b0b0d;
      font-size: 14.5px;
      font-weight: 800;
      letter-spacing: 0.8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
      transition: all 0.2s ease;
    }

    .cta-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
    }

    .cta-btn.copied {
      background: linear-gradient(135deg, #34d399 0%, #059669 100%);
      color: #fff;
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.4);
    }

    /* Quick Action Hub */
    .footer-nav {
      background: rgba(10, 10, 12, 0.96);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 14px 10px 16px;
    }

    .nav-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 600;
      transition: 0.2s;
    }

    .nav-btn:hover, .nav-btn:active {
      color: var(--gold-primary);
    }

    .nav-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }

    .nav-btn:active .nav-icon {
      background: rgba(212, 175, 55, 0.18);
      border-color: var(--gold-primary);
    }
  </style>
</head>
